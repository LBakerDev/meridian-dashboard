<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meridian</title>
    <!-- Apply the saved color scheme (dark by default) before the first paint, so there's no flash. -->
    <script>
      try {
        var saved = localStorage.getItem('mantine-color-scheme-value')
        var scheme = saved === 'light' ? 'light' : saved === 'auto' && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.setAttribute('data-mantine-color-scheme', scheme)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
