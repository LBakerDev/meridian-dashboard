<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meridian</title>
    <!-- Apply the color scheme before the first paint, so there's no flash: the saved
         choice if there is one, otherwise the device's (dark if it can't say). -->
    <script>
      try {
        var saved = localStorage.getItem('mantine-color-scheme-value')
        var prefersLight = matchMedia('(prefers-color-scheme: light)').matches
        var scheme = saved === 'light' || saved === 'dark' ? saved : prefersLight ? 'light' : 'dark'
        document.documentElement.setAttribute('data-mantine-color-scheme', scheme)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
