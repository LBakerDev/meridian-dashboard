# One Render web service: Express serves the mock API and the built app.
# In Render: New → Blueprint → pick this repo. See README "Deploying".
services:
  - type: web
    name: meridian
    runtime: node
    # Starter (0.5 CPU, 512 MB): always on, so no cold start for visitors.
    plan: starter
    # Dev dependencies are needed to build (TypeScript, Vite).
    buildCommand: npm install --include=dev && npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '22'
